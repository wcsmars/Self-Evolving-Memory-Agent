[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "self-evolving-memory-agent"
version = "0.1.0"
description = "Evidence-preserving memory with temporal retrieval and reversible self-evolution."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Chung Shing Mars Wong"}]
dependencies = []

[project.scripts]
memory-agent = "memory_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memory_agent = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]

